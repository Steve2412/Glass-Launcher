name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-24.04 ya trae el Android SDK instalado
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Mostrar errores de compilación
        if: failure()
        run: |
          ERRS=$(grep -E "^e: |^w: .*deprecat.*error|What went wrong|Could not resolve|error:" build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Errores de compilacion::${ERRS}"

      - name: Renombrar APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GlassLauncher-${GITHUB_SHA::7}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-apk
          path: out/*.apk

      - name: Publicar release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Glass Launcher 1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*.apk
