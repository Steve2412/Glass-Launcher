name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GlassLauncher-${GITHUB_SHA::7}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-apk
          path: out/*.apk

      - name: Publicar release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
